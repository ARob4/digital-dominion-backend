<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SEBC Interactive Print Demo</title><style>body{margin:0;font-family:Arial,sans-serif;background:#0b0d0e;color:#fff}main{max-width:520px;margin:auto;padding:22px}.card{border:1px solid #333;background:#151819;padding:20px}.lime{color:#b0ed00}.btn{display:block;width:100%;padding:14px;border:0;background:#b0ed00;color:#0b0d0e;font-weight:800;margin-top:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{border:1px solid #333;padding:14px;background:#101213}.hidden{display:none}.badge{display:inline-block;padding:5px 8px;background:#b0ed00;color:#0b0d0e;font-size:12px;font-weight:800}h1{font-size:32px;line-height:1;margin:10px 0}h2{font-size:22px}p{color:#c8cbcc;line-height:1.5}</style></head><body><main><div class="badge">SEBC 2027 DEMO</div><h1>Scan. Explore. Engage.</h1><p>This simulates an interactive event experience launched from a printed program or sign.</p><div class="card"><h2>Printed Program Detected</h2><p>Strong Foundation. Bold Futures.</p><button class="btn" id="start">Activate Experience</button><div id="exp" class="hidden"><div class="grid" style="margin-top:16px"><button class="tile" data-v="edu"><strong>Education</strong><br><small>Build my schedule</small></button><button class="tile" data-v="exh"><strong>Exhibitors</strong><br><small>Find booths</small></button><button class="tile" data-v="sp"><strong>Sponsors</strong><br><small>Unlock offers</small></button><button class="tile" data-v="rw"><strong>Challenge</strong><br><small>Collect badges</small></button></div><div id="out" class="card" style="margin-top:12px"></div></div></div></main><script>const s=document.getElementById('start'),e=document.getElementById('exp'),o=document.getElementById('out');s.onclick=()=>{s.style.display='none';e.classList.remove('hidden');o.innerHTML='<h2 class="lime">Welcome to SEBC 2027</h2><p>Choose an interactive option above.</p>'};document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{let v=b.dataset.v;let m={edu:'<h2>Education</h2><p>10:00 AM — Opening General Session</p><p>1:30 PM — Builder Growth Lab</p><p>3:00 PM — Digital Marketing & AI</p>',exh:'<h2>Featured Exhibitors</h2><p>Booth 214 — FutureBuild Systems</p><p>Booth 406 — Coastal Materials</p>',sp:'<h2>Sponsor Activation</h2><p>Tap a sponsor offer, watch a short video, or unlock a show-floor promotion.</p>',rw:'<h2>Show Floor Challenge</h2><p>Scan 4 participating booths to unlock a prize entry.</p>'};o.innerHTML=m[v]})</script></body></html>
