<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#05070b">
<title>SEBC Cover Recognition Test</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b;font-family:Arial,Helvetica,sans-serif}a-scene{position:fixed!important;inset:0!important}.hud{position:fixed;z-index:20;top:0;left:0;right:0;padding:calc(12px + env(safe-area-inset-top)) 14px 12px;color:#fff;background:linear-gradient(180deg,rgba(0,0,0,.82),rgba(0,0,0,0));pointer-events:none}.status{display:inline-block;background:rgba(0,0,0,.75);border:1px solid rgba(255,255,255,.3);padding:9px 11px;font-size:12px;font-weight:900}.status.found{background:rgba(1,30,65,.94);border-color:#bc9800}.instructions{margin-top:8px;max-width:365px;font-size:12px;line-height:1.45;text-shadow:0 1px 3px #000}.scan{position:fixed;z-index:12;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}.frame{width:min(70vw,295px);aspect-ratio:652/1720;border:2px solid #fff;box-shadow:0 0 0 999px rgba(0,0,0,.2);position:relative}.frame:before,.frame:after{content:"";position:absolute;left:12%;right:12%;height:2px;background:#bc9800}.frame:before{top:0}.frame:after{bottom:0}.drawer{position:fixed;z-index:50;left:0;right:0;bottom:0;max-height:76vh;background:#f5f6f7;color:#111820;border-top:4px solid #bc9800;transform:translateY(103%);transition:.2s;overflow:auto;padding-bottom:env(safe-area-inset-bottom)}.drawer.open{transform:translateY(0)}.dhead{position:sticky;top:0;background:#011e41;color:#fff;padding:14px 15px;display:flex;align-items:center;justify-content:space-between;gap:10px}.dhead strong{font-size:17px}.close{width:38px;height:38px;border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;font-size:22px}.dbody{padding:14px}.card{background:#fff;border:1px solid #d9dde3;border-left:4px solid #011e41;padding:12px;margin-bottom:9px}.card.gold{border-left-color:#bc9800}.top{display:flex;justify-content:space-between;gap:10px}.time{font-size:12px;color:#9b7a00;font-weight:900}.track{font-size:10px;color:#65717e;font-weight:800;text-align:right}.title{font-size:14px;font-weight:800;line-height:1.3;margin:6px 0}.meta{font-size:12px;color:#66717d;line-height:1.5}.roomgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.room{background:#fff;border:1px solid #d9dde3;padding:12px}.room strong{display:block;font-size:12px;margin-bottom:5px}.room span{color:#9b7a00;font-size:12px;font-weight:900}.button{width:100%;border:0;background:#bc9800;color:#fff;padding:13px;font-weight:900;margin-top:10px}.footer{position:fixed;z-index:11;left:0;right:0;bottom:7px;text-align:center;color:rgba(255,255,255,.7);font-size:10px;pointer-events:none}.readybtn{position:fixed;z-index:21;left:14px;right:14px;bottom:calc(18px + env(safe-area-inset-bottom));display:none}.readybtn button{width:100%;border:0;background:#bc9800;color:#fff;padding:14px;font-weight:900;text-transform:uppercase}
</style>
</head>
<body>
<div class="hud"><div id="status" class="status">CAMERA STARTING</div><div id="instructions" class="instructions">Allow camera access, then point your phone at the full front cover of the 2026 SEBC Show Program.</div></div>
<div id="scan" class="scan"><div class="frame"></div></div>
<div id="readybtn" class="readybtn"><button id="menuBtn">Open Interactive Menu</button></div>
<div class="footer">TEST MODE • Built by AR Creative Marketing</div>
<div id="drawer" class="drawer"><div class="dhead"><strong id="drawerTitle">SEBC 2026</strong><button id="close" class="close">×</button></div><div id="drawerBody" class="dbody"></div></div>

<a-scene mindar-image="imageTargetSrc: ./target.mind; autoStart: true; uiLoading: yes; uiScanning: no; uiError: yes; filterMinCF: 0.0001; filterBeta: 0.001; warmupTolerance: 5; missTolerance: 5;" color-space="sRGB" renderer="colorManagement:true" vr-mode-ui="enabled:false" device-orientation-permission-ui="enabled:false">
<a-camera position="0 0 0" look-controls="enabled:false" cursor="rayOrigin: mouse" raycaster="objects: .clickable"></a-camera>
<a-entity id="target" mindar-image-target="targetIndex:0">
  <a-plane position="0 0 .02" width=".92" height="1.35" color="#011e41" opacity=".88"></a-plane>
  <a-text value="SEBC 2026" position="0 .50 .04" align="center" color="#ffffff" width="1.55"></a-text>
  <a-text value="INTERACTIVE SHOW GUIDE" position="0 .37 .04" align="center" color="#d4b64a" width="1.12"></a-text>
  <a-plane class="clickable" data-panel="today" position="0 .16 .05" width=".78" height=".16" color="#bc9800"></a-plane><a-text value="TODAY AT SEBC" position="0 .16 .06" align="center" color="#fff" width="1.08"></a-text>
  <a-plane class="clickable" data-panel="sessions" position="0 -.06 .05" width=".78" height=".16" color="#fff"></a-plane><a-text value="SESSIONS" position="0 -.06 .06" align="center" color="#011e41" width="1.08"></a-text>
  <a-plane class="clickable" data-panel="rooms" position="0 -.28 .05" width=".78" height=".16" color="#fff"></a-plane><a-text value="ROOMS + TRACKS" position="0 -.28 .06" align="center" color="#011e41" width="1.02"></a-text>
  <a-plane class="clickable" data-panel="events" position="0 -.50 .05" width=".78" height=".16" color="#fff"></a-plane><a-text value="EVENT HIGHLIGHTS" position="0 -.50 .06" align="center" color="#011e41" width=".98"></a-text>
  <a-text value="Tap a button on the cover" position="0 -.73 .05" align="center" color="#d9e3ee" width=".9"></a-text>
</a-entity>
</a-scene>
<script>
const panels={today:{title:'Today at SEBC',html:`<div class="meta" style="margin-bottom:12px"><strong>Wednesday, July 29, 2026</strong><br>Live prototype using real 2026 program content.</div><div class="card gold"><div class="top"><div class="time">9:00 a.m. - 10:00 a.m.</div><div class="track">GENERAL SESSION<br>South 210 D–E</div></div><div class="title">A Mid-Year Housing and Economic Outlook</div><div class="meta">Dr. Robert Dietz, NAHB • FCMB & YBP</div></div><div class="card gold"><div class="top"><div class="time">10:00 a.m. - 4:00 p.m.</div><div class="track">EXPO HALL</div></div><div class="title">SEBC Expo Hall Open</div><div class="meta">Explore products, services, tools and innovations across the show floor.</div></div><div class="card gold"><div class="top"><div class="time">11:00 a.m. - 12:00 p.m.</div><div class="track">GENERAL SESSION<br>South 210 D–E</div></div><div class="title">Work Smarter with AI: A Hands-On Workshop for Building Pros</div><div class="meta">Joseph Burak, TRANSiT Strategy & Analytics • YBP</div></div>`},sessions:{title:'2026 Sessions',html:`<div class="card"><div class="time">8:00 a.m. - 9:00 a.m.</div><div class="title">Workers Compensation Compliance</div><div class="meta">Michele Delaney, LRA Insurance • CE Track 1 • South 220 D–E</div></div><div class="card"><div class="time">8:00 a.m. - 9:00 a.m.</div><div class="title">Windows, Doors & Wind: The Builder’s Guide to Opening Protection</div><div class="meta">Shane Gerwig, Southeast Code Consultants • CE Track 2 • South 220 F–G</div></div><div class="card gold"><div class="time">9:00 a.m. - 10:00 a.m.</div><div class="title">A Mid-Year Housing and Economic Outlook</div><div class="meta">Dr. Robert Dietz, NAHB • General Session • South 210 D–E</div></div><div class="card gold"><div class="time">11:00 a.m. - 12:00 p.m.</div><div class="title">Work Smarter with AI: A Hands-On Workshop for Building Pros</div><div class="meta">Joseph Burak • General Session • South 210 D–E</div></div><div class="card"><div class="time">Thursday • 9:00 a.m. - 10:00 a.m.</div><div class="title">How AI Is Reshaping Construction: What Builders Need to Know Now</div><div class="meta">Marine Sargsyan, HOUZZ • General Session • South 210 D–E</div></div><div class="card"><div class="time">Thursday • 9:05 a.m. - 10:05 a.m.</div><div class="title">Essential Tools for Great Project Management</div><div class="meta">Bobby Mink, Choice Consulting and Management, LLC • Level Up • South 210 B–C • FCMB</div></div>`},rooms:{title:'Rooms + Education Tracks',html:`<div class="roomgrid"><div class="room"><strong>General Sessions</strong><span>South 210 D–E</span></div><div class="room"><strong>CE Track 1</strong><span>South 220 D–E</span><div class="meta">Sponsored by RocketCert, LLC</div></div><div class="room"><strong>CE Track 2</strong><span>South 220 F–G</span><div class="meta">Sponsored by DBPR</div></div><div class="room"><strong>Level Up</strong><span>South 210 B–C</span><div class="meta">Sponsored by Homes.com</div></div></div>`},events:{title:'2026 Event Highlights',html:`<div class="card"><div class="time">Wednesday • 4:00 p.m. - 5:00 p.m.</div><div class="title">Young Building Professionals Happy Hour</div></div><div class="card"><div class="time">Wednesday • 5:30 p.m. - 8:30 p.m.</div><div class="title">SEBC Bash and Silent Auction</div><div class="meta">Benefiting The FHB Foundation.</div></div><div class="card"><div class="time">Thursday • 12:30 p.m. - 2:00 p.m.</div><div class="title">Good Government Lunch</div><div class="meta">Ticket required.</div></div><div class="card"><div class="time">Thursday • 6:30 p.m. - 8:30 p.m.</div><div class="title">FHBA Awards & Hall of Fame Ceremony</div><div class="meta">Ticket required.</div></div><div class="card"><div class="time">Friday • 7:00 p.m. - 9:00 p.m.</div><div class="title">Aurora Awards Gala</div><div class="meta">Ticket required.</div></div>`}};
const drawer=document.getElementById('drawer'),title=document.getElementById('drawerTitle'),body=document.getElementById('drawerBody'),status=document.getElementById('status'),instructions=document.getElementById('instructions'),scan=document.getElementById('scan'),ready=document.getElementById('readybtn');function openPanel(n){const p=panels[n]||panels.today;title.textContent=p.title;body.innerHTML=p.html;drawer.classList.add('open')}document.getElementById('close').onclick=()=>drawer.classList.remove('open');document.getElementById('menuBtn').onclick=()=>openPanel('today');document.querySelectorAll('.clickable').forEach(x=>x.addEventListener('click',()=>openPanel(x.dataset.panel)));const target=document.getElementById('target');target.addEventListener('targetFound',()=>{status.textContent='COVER RECOGNIZED ✓';status.classList.add('found');instructions.textContent='Tracking locked. The menu is anchored to the physical cover. Tap a button.';scan.style.display='none';ready.style.display='block'});target.addEventListener('targetLost',()=>{status.textContent='COVER LOST — RE-AIM';status.classList.remove('found');instructions.textContent='Point the camera back at the entire 2026 SEBC cover.';scan.style.display='flex';ready.style.display='none'});const scene=document.querySelector('a-scene');scene.addEventListener('arReady',()=>{status.textContent='READY — FIND THE COVER';instructions.textContent='Point at the full 2026 SEBC Show Program cover. Fill most of the frame and avoid glare.'});scene.addEventListener('arError',()=>{status.textContent='CAMERA ERROR';instructions.textContent='Confirm camera permission in your browser, then reload.'});
</script>
</body>
</html>
