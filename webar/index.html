<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#011e41">
<title>SEBC Interactive Logo Test</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
:root{--navy:#011e41;--gold:#e5bb00;--white:#fff;--soft:#f5f7fa;--ink:#101827;--muted:#647083;--line:#d8dee7}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important;font-family:Arial,Helvetica,sans-serif}body{color:#fff}a-scene{position:fixed!important;inset:0!important;background:transparent!important}.a-canvas{background:transparent!important}
.hud{position:fixed;z-index:30;top:0;left:0;right:0;padding:calc(12px + env(safe-area-inset-top)) 14px 14px;background:linear-gradient(180deg,rgba(0,0,0,.72),rgba(0,0,0,0));pointer-events:none}.status{display:inline-flex;align-items:center;gap:7px;background:rgba(0,0,0,.68);border:1px solid rgba(255,255,255,.3);padding:9px 11px;font-size:12px;font-weight:900;letter-spacing:.03em}.status.found{background:rgba(1,30,65,.92);border-color:var(--gold)}.instructions{margin-top:7px;max-width:390px;font-size:12px;line-height:1.45;text-shadow:0 1px 3px #000}.scan{position:fixed;z-index:18;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}.frame{width:min(82vw,420px);aspect-ratio:320/112;border:2px solid rgba(255,255,255,.9);position:relative;box-shadow:0 0 0 999px rgba(0,0,0,.18)}.frame:before,.frame:after{content:"";position:absolute;left:8%;right:8%;height:2px;background:var(--gold)}.frame:before{top:-2px}.frame:after{bottom:-2px}.scan-label{position:absolute;top:calc(50% + min(41vw,210px));left:20px;right:20px;text-align:center;font-size:11px;font-weight:800;text-shadow:0 1px 3px #000}
.target-chip{position:fixed;z-index:31;right:14px;top:calc(12px + env(safe-area-inset-top));display:none;background:rgba(1,30,65,.9);border:1px solid var(--gold);padding:9px 10px;font-size:10px;font-weight:900;letter-spacing:.05em}.target-chip.show{display:block}.footer{position:fixed;z-index:16;left:0;right:0;bottom:8px;text-align:center;color:rgba(255,255,255,.75);font-size:10px;pointer-events:none;text-shadow:0 1px 3px #000}
.drawer{position:fixed;z-index:60;left:0;right:0;bottom:0;max-height:78vh;background:rgba(247,249,252,.96);color:var(--ink);border-top:4px solid var(--gold);transform:translateY(103%);transition:transform .22s ease;overflow:auto;padding-bottom:env(safe-area-inset-bottom);backdrop-filter:blur(12px)}.drawer.open{transform:translateY(0)}.dhead{position:sticky;top:0;background:rgba(1,30,65,.97);color:#fff;padding:14px 15px;display:flex;align-items:center;justify-content:space-between;gap:10px;z-index:2}.dhead strong{font-size:17px}.close{width:38px;height:38px;border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;font-size:22px}.dbody{padding:14px}.card{background:#fff;border:1px solid var(--line);border-left:4px solid var(--navy);padding:12px;margin-bottom:9px}.card.gold{border-left-color:var(--gold)}.top{display:flex;justify-content:space-between;gap:10px}.time{font-size:12px;color:#9b7a00;font-weight:900}.track{font-size:10px;color:var(--muted);font-weight:800;text-align:right}.title{font-size:14px;font-weight:800;line-height:1.3;margin:6px 0}.meta{font-size:12px;color:var(--muted);line-height:1.5}.roomgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.room{background:#fff;border:1px solid var(--line);padding:12px}.room strong{display:block;font-size:12px;margin-bottom:5px}.room span{color:#9b7a00;font-size:12px;font-weight:900}.section-note{background:#eaf0f7;border-left:4px solid var(--navy);padding:11px 12px;margin-bottom:10px;font-size:12px;line-height:1.5}.button{width:100%;border:0;background:var(--navy);color:#fff;padding:13px;font-weight:900;margin-top:10px}.button.gold{background:var(--gold);color:#172033}
.menu-fallback{position:fixed;z-index:25;left:14px;right:14px;bottom:calc(22px + env(safe-area-inset-bottom));display:none}.menu-fallback button{width:100%;border:1px solid var(--gold);background:rgba(1,30,65,.88);color:#fff;padding:13px;font-weight:900}.menu-fallback.show{display:block}
@media(max-width:420px){.roomgrid{grid-template-columns:1fr}.target-chip{top:calc(52px + env(safe-area-inset-top));right:14px}}
</style>
</head>
<body>
<div class="hud"><div id="status" class="status">CAMERA STARTING</div><div id="instructions" class="instructions">Allow camera access, then point at either the full-color SEBC logo or the white SEBC logo on a dark navy background.</div></div>
<div id="targetChip" class="target-chip"></div>
<div id="scan" class="scan"><div class="frame"></div><div class="scan-label">FILL THE FRAME WITH THE FULL SEBC LOGO LOCKUP</div></div>
<div id="menuFallback" class="menu-fallback"><button id="openMenuBtn">OPEN SEBC INTERACTIVE GUIDE</button></div>
<div class="footer">DUAL-LOGO TEST • Built by AR Creative Marketing</div>

<div id="drawer" class="drawer"><div class="dhead"><strong id="drawerTitle">SEBC Interactive Guide</strong><button id="close" class="close" aria-label="Close">×</button></div><div id="drawerBody" class="dbody"></div></div>

<a-scene mindar-image="imageTargetSrc: ./target.mind; autoStart: true; uiLoading: yes; uiScanning: no; uiError: yes; filterMinCF: 0.0001; filterBeta: 0.001; warmupTolerance: 5; missTolerance: 8;" color-space="sRGB" renderer="colorManagement:true; alpha:true" vr-mode-ui="enabled:false" device-orientation-permission-ui="enabled:false">
<a-camera position="0 0 0" look-controls="enabled:false" cursor="rayOrigin: mouse" raycaster="objects: .clickable"></a-camera>

<a-entity id="targetColor" mindar-image-target="targetIndex:0">
  <a-plane position="0 .31 .03" width=".64" height=".10" color="#011e41" opacity=".86"></a-plane>
  <a-text value="SEBC INTERACTIVE GUIDE" position="0 .31 .04" align="center" color="#ffffff" width="1.20"></a-text>
  <a-plane class="clickable" data-panel="today" position="-.28 .15 .04" width=".48" height=".11" color="#e5bb00" opacity=".93"></a-plane><a-text value="TODAY" position="-.28 .15 .05" align="center" color="#011e41" width=".82"></a-text>
  <a-plane class="clickable" data-panel="sessions" position=".28 .15 .04" width=".48" height=".11" color="#011e41" opacity=".90"></a-plane><a-text value="SESSIONS" position=".28 .15 .05" align="center" color="#ffffff" width=".82"></a-text>
  <a-plane class="clickable" data-panel="exhibitors" position="-.28 .01 .04" width=".48" height=".11" color="#011e41" opacity=".90"></a-plane><a-text value="EXHIBITORS" position="-.28 .01 .05" align="center" color="#ffffff" width=".72"></a-text>
  <a-plane class="clickable" data-panel="bex" position=".28 .01 .04" width=".48" height=".11" color="#011e41" opacity=".90"></a-plane><a-text value="BEX" position=".28 .01 .05" align="center" color="#ffffff" width=".82"></a-text>
  <a-plane class="clickable" data-panel="rooms" position="-.28 -.13 .04" width=".48" height=".11" color="#011e41" opacity=".90"></a-plane><a-text value="ROOMS" position="-.28 -.13 .05" align="center" color="#ffffff" width=".82"></a-text>
  <a-plane class="clickable" data-panel="events" position=".28 -.13 .04" width=".48" height=".11" color="#011e41" opacity=".90"></a-plane><a-text value="EVENTS" position=".28 -.13 .05" align="center" color="#ffffff" width=".82"></a-text>
  <a-text value="Tap a floating button" position="0 -.27 .04" align="center" color="#ffffff" width=".72"></a-text>
</a-entity>

<a-entity id="targetWhite" mindar-image-target="targetIndex:1">
  <a-plane position="0 .31 .03" width=".64" height=".10" color="#011e41" opacity=".86"></a-plane>
  <a-text value="SEBC INTERACTIVE GUIDE" position="0 .31 .04" align="center" color="#ffffff" width="1.20"></a-text>
  <a-plane class="clickable" data-panel="today" position="-.28 .15 .04" width=".48" height=".11" color="#e5bb00" opacity=".93"></a-plane><a-text value="TODAY" position="-.28 .15 .05" align="center" color="#011e41" width=".82"></a-text>
  <a-plane class="clickable" data-panel="sessions" position=".28 .15 .04" width=".48" height=".11" color="#011e41" opacity=".90"></a-plane><a-text value="SESSIONS" position=".28 .15 .05" align="center" color="#ffffff" width=".82"></a-text>
  <a-plane class="clickable" data-panel="exhibitors" position="-.28 .01 .04" width=".48" height=".11" color="#011e41" opacity=".90"></a-plane><a-text value="EXHIBITORS" position="-.28 .01 .05" align="center" color="#ffffff" width=".72"></a-text>
  <a-plane class="clickable" data-panel="bex" position=".28 .01 .04" width=".48" height=".11" color="#011e41" opacity=".90"></a-plane><a-text value="BEX" position=".28 .01 .05" align="center" color="#ffffff" width=".82"></a-text>
  <a-plane class="clickable" data-panel="rooms" position="-.28 -.13 .04" width=".48" height=".11" color="#011e41" opacity=".90"></a-plane><a-text value="ROOMS" position="-.28 -.13 .05" align="center" color="#ffffff" width=".82"></a-text>
  <a-plane class="clickable" data-panel="events" position=".28 -.13 .04" width=".48" height=".11" color="#011e41" opacity=".90"></a-plane><a-text value="EVENTS" position=".28 -.13 .05" align="center" color="#ffffff" width=".82"></a-text>
  <a-text value="Tap a floating button" position="0 -.27 .04" align="center" color="#ffffff" width=".72"></a-text>
</a-entity>
</a-scene>

<script>
const panels={
 today:{title:'Today at SEBC',html:`<div class="section-note"><strong>Wednesday, July 29, 2026</strong><br>Real content from the 2026 SEBC show program.</div><div class="card gold"><div class="top"><div class="time">9:00 a.m. - 10:00 a.m.</div><div class="track">GENERAL SESSION<br>South 210 D-E</div></div><div class="title">A Mid-Year Housing and Economic Outlook</div><div class="meta">Dr. Robert Dietz, NAHB</div></div><div class="card gold"><div class="top"><div class="time">10:00 a.m. - 4:00 p.m.</div><div class="track">EXPO HALL</div></div><div class="title">SEBC Expo Hall Open</div></div><div class="card gold"><div class="top"><div class="time">11:00 a.m. - 12:00 p.m.</div><div class="track">GENERAL SESSION<br>South 210 D-E</div></div><div class="title">Work Smarter with AI: A Hands-On Workshop for Building Pros</div><div class="meta">Joseph Burak, TRANSiT Strategy & Analytics</div></div>`},
 sessions:{title:'2026 Sessions',html:`<div class="section-note">A working sample of the real 2026 schedule. The production guide can expose the full searchable session database.</div><div class="card"><div class="time">Wednesday • 8:00 a.m.</div><div class="title">Workers Compensation Compliance</div><div class="meta">Michele Delaney • CE Track 1 • South 220 D-E</div></div><div class="card"><div class="time">Wednesday • 8:00 a.m.</div><div class="title">Windows, Doors & Wind: The Builder's Guide to Opening Protection</div><div class="meta">Shane Gerwig • CE Track 2 • South 220 F-G</div></div><div class="card gold"><div class="time">Wednesday • 9:00 a.m.</div><div class="title">A Mid-Year Housing and Economic Outlook</div><div class="meta">Dr. Robert Dietz • General Session • South 210 D-E</div></div><div class="card"><div class="time">Thursday • 9:00 a.m.</div><div class="title">How AI Is Reshaping Construction: What Builders Need to Know Now</div><div class="meta">Marine Sargsyan, HOUZZ • General Session • South 210 D-E</div></div><div class="card"><div class="time">Thursday • 9:05 a.m.</div><div class="title">Essential Tools for Great Project Management</div><div class="meta">Bobby Mink • Level Up • South 210 B-C</div></div>`},
 exhibitors:{title:'Exhibitors',html:`<div class="section-note"><strong>357 exhibitors</strong> were loaded into the full 2026 interactive-guide prototype. This AR layer is the branded entry point into that searchable directory.</div><div class="card"><div class="title">Find a company or booth</div><div class="meta">Production behavior: search company name, product category, or booth number while keeping the AR camera experience active.</div></div><button class="button gold" data-demo="exhibitor">SIMULATE EXHIBITOR SEARCH</button>`},
 bex:{title:'Builder Exchange (BEX)',html:`<div class="section-note">The 2026 program data includes BEX builder and exhibitor participant lists with booth information.</div><div class="card"><div class="title">BEX Builders</div><div class="meta">Browse participating builders and plan meetings from the same interactive experience.</div></div><div class="card"><div class="title">BEX Exhibitors</div><div class="meta">Search participating exhibitors and booth locations.</div></div>`},
 rooms:{title:'Rooms + Tracks',html:`<div class="roomgrid"><div class="room"><strong>General Sessions</strong><span>South 210 D-E</span></div><div class="room"><strong>CE Track 1</strong><span>South 220 D-E</span><div class="meta">RocketCert, LLC</div></div><div class="room"><strong>CE Track 2</strong><span>South 220 F-G</span><div class="meta">DBPR</div></div><div class="room"><strong>Level Up</strong><span>South 210 B-C</span><div class="meta">Homes.com</div></div></div>`},
 events:{title:'Event Highlights',html:`<div class="card"><div class="time">Wednesday • 4:00 p.m. - 5:00 p.m.</div><div class="title">Young Building Professionals Happy Hour</div></div><div class="card"><div class="time">Wednesday • 5:30 p.m. - 8:30 p.m.</div><div class="title">SEBC Bash and Silent Auction</div></div><div class="card"><div class="time">Thursday • 12:30 p.m. - 2:00 p.m.</div><div class="title">Good Government Lunch</div></div><div class="card"><div class="time">Thursday • 6:30 p.m. - 8:30 p.m.</div><div class="title">FHBA Awards & Hall of Fame Ceremony</div></div><div class="card"><div class="time">Friday • 7:00 p.m. - 9:00 p.m.</div><div class="title">Aurora Awards Gala</div></div>`}
};
const status=document.getElementById('status'),instructions=document.getElementById('instructions'),scan=document.getElementById('scan'),chip=document.getElementById('targetChip'),fallback=document.getElementById('menuFallback'),drawer=document.getElementById('drawer'),drawerTitle=document.getElementById('drawerTitle'),drawerBody=document.getElementById('drawerBody');
let activeTargets=0;
function openPanel(name){const p=panels[name]||panels.today;drawerTitle.textContent=p.title;drawerBody.innerHTML=p.html;drawer.classList.add('open');const demo=drawerBody.querySelector('[data-demo="exhibitor"]');if(demo){demo.addEventListener('click',()=>{demo.textContent='SEARCH READY — FULL DIRECTORY CONNECTS HERE';demo.disabled=true;});}}
function found(label){activeTargets++;status.textContent='SEBC LOGO RECOGNIZED ✓';status.classList.add('found');instructions.textContent='Tracking locked. The floating SEBC menu is anchored to the logo. Tap an option.';scan.style.display='none';chip.textContent=label;chip.classList.add('show');fallback.classList.add('show');}
function lost(){activeTargets=Math.max(0,activeTargets-1);if(activeTargets===0){status.textContent='LOGO LOST — RE-AIM';status.classList.remove('found');instructions.textContent='Point the camera back at the full SEBC logo lockup.';scan.style.display='flex';chip.classList.remove('show');fallback.classList.remove('show');}}
const colorTarget=document.getElementById('targetColor'),whiteTarget=document.getElementById('targetWhite');
colorTarget.addEventListener('targetFound',()=>found('FULL-COLOR LOGO'));
colorTarget.addEventListener('targetLost',lost);
whiteTarget.addEventListener('targetFound',()=>found('WHITE-ON-NAVY LOGO'));
whiteTarget.addEventListener('targetLost',lost);
document.querySelectorAll('.clickable').forEach(el=>el.addEventListener('click',()=>openPanel(el.dataset.panel)));
document.getElementById('openMenuBtn').addEventListener('click',()=>openPanel('today'));
document.getElementById('close').addEventListener('click',()=>drawer.classList.remove('open'));
drawer.addEventListener('click',e=>{if(e.target===drawer)drawer.classList.remove('open')});
const scene=document.querySelector('a-scene');scene.addEventListener('arReady',()=>{status.textContent='READY — SCAN AN SEBC LOGO';instructions.textContent='Use either the full-color SEBC logo or the white SEBC logo on dark navy. Fill most of the frame.'});scene.addEventListener('arError',()=>{status.textContent='CAMERA ERROR';instructions.textContent='Confirm camera permission in your browser, then reload.'});
</script>
</body>
</html>
