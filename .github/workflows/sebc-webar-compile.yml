name: Compile SEBC WebAR Targets

on:
  push:
    branches: [sebc-webar-test]
    paths:
      - 'webar/placards/**'
      - 'webar/compile.mjs'
      - '.github/workflows/sebc-webar-compile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile-targets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sebc-webar-test
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev libpixman-1-dev
          npm init -y
          npm install mind-ar@1.2.5
      - name: Build placard targets and UI
        run: node webar/compile.mjs
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webar/target.mind webar/product.html
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Build SEBC booth placards [skip ci]"
            git push origin sebc-webar-test
          fi
