name: Compile SEBC WebAR Targets

on:
  push:
    branches:
      - sebc-webar-test
    paths:
      - 'webar/target-color.jpg'
      - 'webar/target-white-navy.jpg'
      - 'webar/compile.mjs'
      - '.github/workflows/sebc-webar-compile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile-targets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: sebc-webar-test

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Verify target files
        run: |
          file webar/target-color.jpg webar/target-white-navy.jpg
          ls -lh webar/target-color.jpg webar/target-white-navy.jpg

      - name: Install canvas build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev libpixman-1-dev

      - name: Install MindAR compiler
        run: |
          npm init -y
          npm install mind-ar@1.2.5

      - name: Compile both image targets
        run: node webar/compile.mjs

      - name: Commit compiled target
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webar/target.mind
          if git diff --cached --quiet; then
            echo "Compiled target is already current."
          else
            git commit -m "Compile dual SEBC logo targets [skip ci]"
            git push origin sebc-webar-test
          fi
