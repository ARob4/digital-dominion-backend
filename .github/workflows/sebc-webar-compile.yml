name: Compile SEBC WebAR Target

on:
  push:
    branches:
      - sebc-webar-test
    paths:
      - 'webar/target-part-*.b64'
      - 'webar/compile.mjs'
      - '.github/workflows/sebc-webar-compile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile-target:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: sebc-webar-test

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Rebuild target image
        shell: bash
        run: |
          cat webar/target-part-0.b64 webar/target-part-1.b64 webar/target-part-2.b64 | base64 --decode > webar/target.jpg
          file webar/target.jpg

      - name: Install MindAR compiler
        run: |
          npm init -y
          npm install mind-ar@1.2.5

      - name: Compile image target
        run: node webar/compile.mjs

      - name: Commit compiled target
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webar/target.jpg webar/target.mind
          if git diff --cached --quiet; then
            echo "Compiled target is already current."
          else
            git commit -m "Compile SEBC WebAR image target [skip ci]"
            git push origin sebc-webar-test
          fi
